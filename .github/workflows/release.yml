name: Build release
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, macos]
        default: all
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  macos:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked
      - run: cargo build --release --locked
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
      - run: bash packaging/macos/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.runner }}
          path: dist/*.dmg
          if-no-files-found: error
  windows:
    if: github.event.inputs.platform != 'macos'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package native Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          & $compiler "/DAppVersion=$version" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Copy-Item target/release/gargantua.exe "dist/Gargantua-$version-windows-x64.exe"
          New-Item -ItemType Directory -Force target/portable/licenses | Out-Null
          Copy-Item target/release/gargantua.exe target/portable/Gargantua.exe
          Copy-Item LICENSE, README.md target/portable/
          Copy-Item assets/fonts/OFL.txt target/portable/licenses/
          Compress-Archive -Path target/portable/* -DestinationPath "dist/Gargantua-$version-windows-x64-portable.zip"
      - name: Smoke-test installer and uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem dist/*-setup.exe).FullName
          $installPath = Join-Path $env:RUNNER_TEMP 'Gargantua-installed'
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installPath" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed: $($process.ExitCode)" }
          $exe = Join-Path $installPath 'Gargantua.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          $process = Start-Process -FilePath $exe -ArgumentList '--help' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installed executable failed to start' }
          $process = Start-Process -FilePath (Join-Path $installPath 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstaller failed' }
          if (Test-Path $exe) { throw 'Uninstaller left the executable behind' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.dmg *.exe *.zip > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Gargantua $GITHUB_REF_NAME" --notes-file packaging/RELEASE_NOTES.md
